name: Daily Amruta Push

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Override date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      - name: Step1 - Fetch article
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python3 scripts/step1_fetch.py

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/
          key: align-models-v2

      - name: Install alignment deps
        run: |
          pip install sentence-transformers numpy matplotlib dateparser lingtrain-aligner
          python3 -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('LaBSE')"

      - name: Step2 - Search + Translate
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: python3 scripts/step2_translate.py

      - name: Step3 - Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.AMRUTA_GITHUB_TOKEN }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: python3 scripts/step3_push.py

      - name: Step3.5 - Email content + source audit
        run: python3 scripts/step3_5_audit_email.py
        continue-on-error: true

      - name: Step4 - Send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 scripts/step4_email.py
