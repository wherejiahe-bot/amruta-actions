name: Daily Amruta Push

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Override date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Step1 - Fetch article
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python3 scripts/step1_fetch.py

      - name: Install deps
        run: |
          pip install numpy dateparser
      - name: Step2 - Search + Translate
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 scripts/step2_translate.py

      - name: Step3 - Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.AMRUTA_GITHUB_TOKEN }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: python3 scripts/step3_push.py

      - name: Step3.5 - Email content + source audit
        id: audit
        run: python3 scripts/step3_5_audit_email.py || true

      - name: Check audit result
        id: check
        run: |
          if [ -f /tmp/audit_report.md ]; then
            if grep -q "判定.*不通过" /tmp/audit_report.md; then
              echo "AUDIT_RESULT=fail" >> $GITHUB_OUTPUT
            else
              echo "AUDIT_RESULT=pass" >> $GITHUB_OUTPUT
            fi
          else
            echo "AUDIT_RESULT=fail" >> $GITHUB_OUTPUT
          fi

      - name: Rework - Retry translation if audit failed
        if: steps.check.outputs.AUDIT_RESULT == 'fail'
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          echo "Audit FAILED. Retrying translation..."
          python3 scripts/step2_translate.py
          python3 scripts/step3_push.py
          python3 scripts/step3_5_audit_email.py || true

      - name: Step4 - Send email
        if: steps.check.outputs.AUDIT_RESULT != 'fail'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 scripts/step4_email.py

      - name: Notify failure
        if: steps.check.outputs.AUDIT_RESULT == 'fail'
        run: |
          echo "::error::Audit failed. Email NOT sent. Check /tmp/audit_report.md for details."
          cat /tmp/audit_report.md